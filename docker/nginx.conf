events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Map for WebSocket connection upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream agentguard_backend {
        server backend:8000;
        keepalive 32;
    }

    upstream agentguard_frontend {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Client body size for batch evaluations and policy creation
        client_max_body_size 16M;

        # 1. Frontend Next.js Console
        location / {
            proxy_pass http://agentguard_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Backend REST API
        location /api/ {
            proxy_pass http://agentguard_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. WebSocket Real-Time Event Stream (with Upgrade headers)
        location /api/v1/events/ws {
            proxy_pass http://agentguard_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 4. OpenAPI & Swagger Docs
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://agentguard_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 5. Health & Liveness Probes
        location ~ ^/health {
            proxy_pass http://agentguard_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
