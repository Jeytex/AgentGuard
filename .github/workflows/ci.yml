name: AgentGuard CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Lint, Quality & Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check app tests

      - name: Run Pytest Regression Suite
        run: |
          pytest tests -v --durations=10

  frontend-ci:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UI

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: UI/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: TypeScript Type Checking
        run: |
          npx tsc --noEmit

      - name: Next.js Production Build
        run: |
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          NEXT_PUBLIC_AGENTGUARD_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_AGENTGUARD_WS_URL: ws://localhost:8000/api/v1/events/ws

  docker-validation:
    name: Docker & Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: agentguard-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./UI
          file: ./UI/Dockerfile
          push: false
          tags: agentguard-frontend:ci

  security-scan:
    name: Credential & Secret Leakage Prevention
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Tracked Files for Leaked Credentials
        run: |
          echo "Scanning tracked git files for sensitive tokens..."
          # Fail if any raw .env files or exposed keys are tracked
          if git ls-files | grep -E '(\.env$|\.env\.local$|\.db$)'; then
            echo "ERROR: Disallowed secret or database file tracked in git repository!"
            exit 1
          fi
          echo "Security scan passed: Zero secrets or unignored files found."
